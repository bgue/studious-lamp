# command = reason; a module command that is not a ProposableCommand row must be listed here.
# ADR-0027 decision 4: every command ticket adds a row or an entry. Acts that a person decides, and
# the owner's own field edits, are never proposed by an agent.
[commands]
# P2-PUNCH S2 quality (the row is `propose_punch_item`, RaisePunchItem)
ClearPunchItem = "person acts directly"
EditPunchItem = "person acts directly"
VerifyPunchItem = "act: verifying is the controller's decision"
ReopenPunchItem = "act: reopening is the controller's decision"
VoidPunchItem = "act: voiding is the controller's decision"
# P2-I4A S2 requisitions (the row is `propose_requisition`, RaiseRequisition)
ApproveRequisition = "act: approving a request is the approver's decision"
RejectRequisition = "act: rejecting a request is the approver's decision"
ScheduleWorkOrder = "act: scheduling commits the crew and the dates"
CloseWorkOrder = "act: closing is the controller's sign-off"
EditRequisition = "person acts directly"
AssignWorkOrder = "person acts directly"
StartWorkOrder = "person acts directly"
CompleteWorkOrder = "person acts directly"
CancelRequisition = "person acts directly"
# P2-I5 S8 awp commands (every one is a person's act or an owner field edit; the proposing rows are
# `propose_cwp`, `propose_iwp_scope`, `propose_progress`, `propose_scope_installed`, `propose_week_commitment`)
DefineWbsNode = "person acts directly"
ReviseWbsNode = "person acts directly"
RetireWbsNode = "person acts directly"
ReinstateWbsNode = "person acts directly"
MapWbsToCostCodes = "person acts directly"
DefinePathOfConstruction = "person acts directly"
MoveCwaInPath = "person acts directly"
DefineCwa = "person acts directly"
ReviseCwa = "person acts directly"
RetireCwa = "person acts directly"
ReviseCwp = "person acts directly"
AllocateCwpToWbs = "person acts directly"
StartCwpDevelopment = "person acts directly"
StartCwpExecution = "person acts directly"
CompleteCwp = "act: completion is a person's decision"
ReleaseCwp = "act: releasing a package commits it to the field"
ReturnCwp = "person acts directly"
CloseCwp = "act: closing is the controller's sign-off"
ReopenCwp = "person acts directly"
VoidCwp = "act: voiding is a person's decision"
RecordExternalPackage = "person acts directly"
UpdateExternalPackage = "person acts directly"
VoidExternalPackage = "person acts directly"
RequestRollup = "person acts directly"
CreateIwp = "person acts directly"
CreateScopeItem = "person acts directly"
RemoveIwpScope = "person acts directly"
PinIwpDocument = "person acts directly"
StartIwpDevelopment = "person acts directly"
SendIwpToConstraintCheck = "person acts directly"
ReturnIwpToDevelopment = "person acts directly"
SplitIwp = "act: splitting is the planner's decision"
CancelIwp = "act: cancelling is a person's decision"
SignOffIwp = "act: sign-off is a person's signature on a hash"
IssueIwp = "act: issuing releases the work to the crew"
HoldIwp = "act: a hold is a person's call"
ReleaseHold = "act: releasing a hold is a person's call"
ReturnScopeItem = "person acts directly"
VerifyScopeItem = "act: verification is the inspector's decision"
StartIwpWork = "person acts directly"
CompleteIwpField = "person acts directly"
OpenWeeklyPlan = "person acts directly"
RecordWeekOutcome = "person acts directly"
CloseWeek = "act: closing a week is the controller's act"
