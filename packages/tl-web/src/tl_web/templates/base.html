<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Throughline{% endblock %}</title>
{% if csrf %}<meta name="csrf-token" content="{{ csrf }}">
{% endif %}<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true,"includeIndicatorStyles":false,"historyCacheSize":0}'>
<link rel="stylesheet" href="/web/static/tl.css">
<script src="/web/static/vendor/htmx/htmx.min.js" defer></script>
<script type="module" src="/web/static/tl.js"></script>
</head>
<body>
<header class="tl-bar">
<span class="tl-brand">Throughline</span>
{% if csrf %}<form method="post" action="/web/sign-out">
<input type="hidden" name="csrf" value="{{ csrf }}">
<button type="submit">Sign out</button>
</form>
{% endif %}</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
