<div id="log-actions" class="tl-actions"{% if oob %} hx-swap-oob="true"{% endif %}>{% for a in actions %}<button type="button" class="tl-action" data-key="{{ a.key }}" data-command="{{ a.command }}"{% if a.asks %} hx-get="{{ a.form_url }}" hx-target="#log-panel" hx-swap="innerHTML"{% else %} hx-post="{{ a.url }}" hx-target="#log-status" hx-swap="outerHTML"{% endif %}>[{{ a.key_label }}] {{ a.label }}</button> {% endfor %}{% if open_url %}<a class="tl-action" id="log-open" href="{{ open_url }}">[Enter] Open record</a>{% endif %}</div>
