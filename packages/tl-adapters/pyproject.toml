[project]
name = "tl-adapters"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2",
  "python-ulid>=2",
  "tl-core",
  "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_adapters"]
