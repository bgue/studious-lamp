[project]
name = "tl-extract"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "openpyxl>=3.1",
  "pypdf>=6.21",
  "tl-core",
]

[dependency-groups]
dev = ["jsonschema>=4"]

# Each extractor is a plugin found by the pipeline through this group (FANOUT D1; the contract is
# tl_core.derivation.types). The callable takes no arguments and returns the extractor.
[project.entry-points."throughline.extractors"]
tabular = "tl_extract.tabular:TabularExtractor"
pdf = "tl_extract.pdf:PdfExtractor"
ocr = "tl_extract.ocr:OcrExtractor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_extract"]
