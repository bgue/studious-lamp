[project]
name = "tl-mod-materials"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "tl-core",
  "tl-schema",
  "tl-adapters",
  "tl-mod-documents",
]

# Entry points (modules, load targets, loaders, publish targets, readiness checks) are added by the
# pieces that write the code they name (P2-I3 S2, S4, T01b, T03); none is declared here.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_mod_materials"]
