[project]
name = "tl-mod-requisitions"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "tl-core",
  "tl-schema",
]

# Entry points other than the module spec are added by the pieces that write the code they name.
[project.entry-points."throughline.modules"]
requisitions = "tl_mod_requisitions.module:spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_mod_requisitions"]
