# Mapping template of the loader `instrument-index` (P1-I8-T07b): the instrument index of the
# incumbent system as a workbook or a CSV file, one row per tag. Read by
# tl_mod_engineering.imports.mapping; the loader framework makes the delimiter a comma because it
# hands the template the extracted grid as CSV text. The sample file
# `dev/seed/legacy/instrument-index.csv` is in this form. Columns the mapping does not use (P&ID,
# remarks, issue date) are kept in the source layer `src.legacy-instr.index`.
name: instrument-index
description: >-
  The instrument index export of the incumbent system, one row per tag: its number, the service,
  a three-letter type code, and the valve data the export carries.
delimiter: ","
columns:
  - {column: "TAG NO", to: number}
  - {column: "SERVICE", to: service}
  - column: "TYPE"
    to: class
    values:
      CV: ControlValve
      HV: ManualValve
      PSV: SafetyValve
      XMTR: Transmitter
      CTRL: Controller
      PMP: Pump
      VSL: Vessel
      HX: HeatExchanger
  - {column: "SIZE (IN)", to: psets.valve_data.size_in, type: decimal}
  - column: "MATERIAL"
    to: psets.valve_data.body_material
    values:
      CS: CS
      "316": SS316L
      "304": SS304
      DPX: DUPLEX
  - {column: "MFR", to: psets.valve_data.manufacturer}
  - {column: "FAIL", to: psets.valve_data.fail_action}
  - {column: "FAT WITNESS", to: psets.valve_data.x.fat_witness_by}
# Columns the file has that the import does not want.
ignore: ["P&ID", "REMARKS", "ISSUED"]
