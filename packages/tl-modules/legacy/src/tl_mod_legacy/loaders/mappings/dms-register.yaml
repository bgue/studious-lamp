# Mapping template of the loader `dms-register` (P1-I8-T07a): the document register export of the
# incumbent DMS, one row per document. Read by tl_mod_documents.imports.mapping; the loader framework
# makes the delimiter a comma because it hands the template the extracted grid as CSV text.
# The sample file `dev/seed/legacy/dms-document-register.csv` is in this form. The old register's
# revision, status and date are kept as a note in the document's description; every column of the
# file, mapped or not, is also kept in the source layer `src.legacy-dms.register`.
name: dms-register
description: >-
  The document register export of the incumbent DMS, one row per document: its number, title,
  type, discipline, originator, and the revision, status and date the old register shows.
delimiter: ","
columns:
  - {column: "DOC NO", to: number}
  - {column: "TITLE", to: title}
  - column: "DOC TYPE"
    to: type
    values:
      ISOMETRIC: ISO
      "P&ID": PID
      "GENERAL ARRANGEMENT": GA
      DATASHEET: DS
      "LOOP DIAGRAM": LD
      SPECIFICATION: SPC
      PROCEDURE: PRC
      CALCULATION: CAL
  - column: "DISCIPLINE"
    to: discipline
    values:
      PIPING: PIP
      MECHANICAL: MEC
      ELECTRICAL: ELE
      INSTRUMENTATION: INS
      CIVIL: CIV
      STRUCTURAL: STR
      PROCESS: PRO
  - {column: "ORIGINATOR", to: originator}
  - {column: "REV", to: revision}
  - column: "STATUS"
    to: status
    values:
      IFA: IFA
      IFR: IFR
      IFC: IFC
      AFC: AFC
      "AS BUILT": ASB
  - {column: "REV DATE", to: date}
# Columns the file has that the import does not want.
ignore: ["FILE PATH", "CHECKED BY", "REMARKS"]
