[project]
name = "tl-mod-schemareg"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "tl-core",
  "tl-schema",
  "tl-adapters",
]

[project.entry-points."throughline.modules"]
schemareg = "tl_mod_schemareg.module:spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_mod_schemareg"]
