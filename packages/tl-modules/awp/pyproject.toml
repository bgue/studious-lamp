[project]
name = "tl-mod-awp"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "tl-core",
  "tl-schema",
  "tl-adapters",
  "tl-mod-engineering",
  "tl-mod-legacy",
]

[project.entry-points."throughline.modules"]
awp = "tl_mod_awp.module:spec"

[project.entry-points."throughline.load_targets"]
awp_wbs = "tl_mod_awp.targets:wbs_target"
awp_cwa = "tl_mod_awp.targets:cwa_target"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_mod_awp"]
