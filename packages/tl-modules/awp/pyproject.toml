[project]
name = "tl-mod-awp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "tl-core",
  "tl-schema",
  "tl-adapters",
  "tl-mod-engineering",
  "tl-mod-legacy",
  "tl-mod-schedule",
]

[project.entry-points."throughline.modules"]
awp = "tl_mod_awp.module:spec"

[project.entry-points."throughline.load_targets"]
awp_wbs = "tl_mod_awp.targets:wbs_target"
awp_cwa = "tl_mod_awp.targets:cwa_target"

[project.entry-points."throughline.loaders"]
awp-wbs = "tl_mod_awp.loaders.awp:wbs_loader"
awp-cwa = "tl_mod_awp.loaders.awp:cwa_loader"

[project.entry-points."throughline.readiness_checks"]
constraints_cleared = "tl_mod_awp.readiness.checks:constraints_cleared"
permits_planned = "tl_mod_awp.checks_na:permits_planned"
inspections_planned = "tl_mod_awp.checks_na:inspections_planned"
labour_requested = "tl_mod_awp.checks_na:labour_requested"
predecessors_handed_over = "tl_mod_awp.checks_na:predecessors_handed_over"
model_slice_available = "tl_mod_awp.checks_na:model_slice_available"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_mod_awp"]
