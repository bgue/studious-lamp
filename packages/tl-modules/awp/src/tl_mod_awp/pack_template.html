<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IWP work pack</title>
<style>
body { font-family: sans-serif; margin: 2em; }
table { border-collapse: collapse; width: 100%; margin-bottom: 1em; }
th, td { border: 1px solid #999; padding: 4px; text-align: left; vertical-align: top; }
.drawing { display: inline-block; margin: 0 1em 1em 0; text-align: center; }
.drawing svg { width: 120px; height: 120px; }
@media print { .drawing { page-break-inside: avoid; } }
</style>
</head>
<body>
<section id="cover">$cover</section>
<section id="scope"><h2>Scope and steps</h2>$scope</section>
<section id="drawings"><h2>Drawings</h2>$drawings</section>
<section id="mto"><h2>Take-off</h2>$mto</section>
<section id="safety"><h2>Safety</h2><p>$safety</p></section>
<section id="quality"><h2>Quality (ITP)</h2><p>$quality</p></section>
<section id="permits"><h2>Permits and scaffold tags</h2><p>$permits</p></section>
<section id="signoff"><h2>Sign-off</h2>$signoff</section>
<footer>Generated $generated</footer>
</body>
</html>
