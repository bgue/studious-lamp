[project]
name = "tl-mod-permits"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "tl-core",
  "tl-schema",
  "tl-adapters",
  "fastapi",
  "mcp",
  "typer",
]

[project.entry-points."throughline.modules"]
permits = "tl_mod_permits.module:spec"

[project.entry-points."throughline.readiness_checks"]
permits_planned = "tl_mod_permits.checks:permits_planned"

[project.entry-points."throughline.scan_cards"]
permits_permit = "tl_mod_permits.scan_card:provider"

[project.entry-points."throughline.form_sources"]
permits_permit = "tl_mod_permits.form_source:source"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_mod_permits"]
