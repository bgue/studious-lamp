[project]
name = "tl-mod-quality"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "tl-core",
  "tl-schema",
  "tl-adapters",
  # the test world makes a restricted record through the correspondence module's own commands
  "tl-mod-correspondence",
]

[project.entry-points."throughline.modules"]
quality = "tl_mod_quality.module:spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_mod_quality"]
