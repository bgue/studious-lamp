[project]
name = "tl-mod-documents"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "sqlalchemy>=2",
  "tl-core",
  "tl-schema",
  "tl-adapters",
  "tl-mod-engineering",
]

[project.entry-points."throughline.modules"]
documents = "tl_mod_documents.module:spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_mod_documents"]
