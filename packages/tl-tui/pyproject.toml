[project]
name = "tl-tui"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "textual",
  "pydantic>=2",
  "tl-core",
  "tl-schema",
  "tl-adapters",
]

[project.scripts]
tl-tui = "tl_tui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_tui"]
