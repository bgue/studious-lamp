[project]
name = "tl-cli"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "typer",
  "rich",
  "pydantic>=2",
  "tl-core",
  "tl-schema",
  "tl-adapters",
  "tl-lake",
]

[project.scripts]
tl = "tl_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_cli"]
