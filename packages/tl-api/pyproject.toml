[project]
name = "tl-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx2",
  "pydantic>=2",
  "tl-core",
  "tl-schema",
  "tl-adapters",
]

[project.scripts]
tl-api = "tl_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_api"]
