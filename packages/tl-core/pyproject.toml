[project]
name = "tl-core"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "python-ulid>=2",
  "pyyaml>=6",
  "tl-schema",
  "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_core"]
