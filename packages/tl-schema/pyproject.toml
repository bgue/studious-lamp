[project]
name = "tl-schema"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "linkml>=1.8",
  "linkml-runtime>=1.8",
  "jsonschema>=4",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_schema"]
