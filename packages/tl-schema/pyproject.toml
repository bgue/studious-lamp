[project]
name = "tl-schema"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "linkml>=1.8",
  "linkml-runtime>=1.8",
  "jsonschema>=4",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_schema"]

# The schema directories and settings tables ship inside the wheel; resources.schema_root() finds them.
# The source path is relative to the workspace root, so a wheel built from an sdist is not supported
# (build wheels from a checkout).
[tool.hatch.build.targets.wheel.force-include]
"../../schema" = "tl_schema/_data/schema"
