[project]
name = "tl-sim"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "pyyaml",
  "typer",
  "mcp",
  "httpx2",
  "tl-core",
  "tl-api",
  "tl-mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_sim"]
