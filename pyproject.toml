[project]
name = "throughline"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "hypothesis",
    "pytest-textual-snapshot",
    "moto[s3]>=5",
]

[tool.uv]
package = false
# linkml requires jsonschema[format], which pulls rfc3987 (GPL-3.0+). Copyleft dependencies are a human gate
# (04-gates.md); format-nongpl validates the same formats with permissive packages.
override-dependencies = ["jsonschema[format-nongpl]>=4.26"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tl-schema = { workspace = true }
tl-core = { workspace = true }
tl-adapters = { workspace = true }
tl-api = { workspace = true }
tl-mcp = { workspace = true }
tl-tui = { workspace = true }
tl-cli = { workspace = true }
tl-sim = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = ["packages/tl-schema/src/tl_schema/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = "--import-mode=importlib"
markers = [
  "parity: runs once per adapter named by --adapters (see conftest.py)",
  "requires_postgres: needs the Postgres server at TL_PG_URL",
]

[tool.pyright]
include = ["packages", "tests"]
exclude = ["**/generated", "**/.venv"]
pythonVersion = "3.12"
# tests/contract reuses the helper module in tests/webhooks (world.py)
extraPaths = ["tests/webhooks", "packages/tl-api/tests"]
typeCheckingMode = "standard"
strict = [
  "packages/tl-core/src",
  "packages/tl-schema/src",
  "packages/tl-adapters/src",
]
