[project]
name = "throughline"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "hypothesis",
    "pytest-textual-snapshot",
    "moto[s3]>=5",
]

[tool.uv]
package = false
# linkml requires jsonschema[format], which pulls rfc3987 (GPL-3.0+). Copyleft dependencies are a human gate
# (04-gates.md); format-nongpl validates the same formats with permissive packages.
override-dependencies = ["jsonschema[format-nongpl]>=4.26"]

[tool.uv.workspace]
# `packages/tl-modules/<name>` holds the modules `tl new module` scaffolds (build spec 03 section 1);
# the directory itself is not a package, hence the exclude.
members = ["packages/*", "packages/tl-modules/*"]
exclude = ["packages/tl-modules"]

[tool.uv.sources]
tl-schema = { workspace = true }
tl-core = { workspace = true }
tl-adapters = { workspace = true }
tl-api = { workspace = true }
tl-mcp = { workspace = true }
tl-tui = { workspace = true }
tl-cli = { workspace = true }
tl-sim = { workspace = true }
tl-lake = { workspace = true }
tl-mod-engineering = { workspace = true }
tl-mod-documents = { workspace = true }
tl-extract = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = ["packages/tl-schema/src/tl_schema/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = "--import-mode=importlib"
markers = [
  "parity: runs once per adapter named by --adapters (see conftest.py)",
  "requires_postgres: needs the Postgres server at TL_PG_URL",
  "slow: takes more than a few seconds (a table of the largest legal size); part of the default run",
  "bench: performance benches over a seeded 100k-record database; run only by `just bench`",
]

[tool.pyright]
include = ["packages", "tests"]
exclude = ["**/generated", "**/.venv"]
pythonVersion = "3.12"
# tests/contract reuses the helper module in tests/webhooks (world.py)
extraPaths = [
  "tests/webhooks",
  "tests/settings",
  "packages/tl-api/tests",
  "tests/extypes",
  "packages/tl-tui/tests",
  "tests/bench",
  "tests/auth",
  "tests/jobs",
  "packages/tl-modules/engineering/tests",
  "packages/tl-modules/documents/tests",
  "packages/tl-extract/tests",
  "packages/tl-extract/tests/golden",
  "tests/contract",
  "tests/threads",
]
typeCheckingMode = "standard"
strict = [
  "packages/tl-core/src",
  "packages/tl-schema/src",
  "packages/tl-adapters/src",
]
