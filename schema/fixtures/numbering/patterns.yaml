# Numbering patterns (brief 8). Read by tl_core.numbering.config; see its docstring for the fields.
# `gap_free: true` (the default) allocates a number only inside the transaction that creates the
# record it names. `reserved` lists inclusive sequence ranges the allocator skips.
patterns:
  - id: core.Record
    record_type: core.Record
    scope: "project:*"
    template: "{project}-{type}-{seq:4}"
    type_code: REC
    gap_free: true
  # Transmittals (brief 9 M1) are numbered by the allocator: P123-TRN-0001. A document number is typed in
  # (it comes from the drawing or the client) and checked by the registry pattern instead.
  - id: documents.Transmittal
    record_type: documents.Transmittal
    scope: "project:*"
    template: "{project}-{type}-{seq:4}"
    type_code: TRN
    gap_free: true
  # Correspondence (brief 9 M10): items P123-COR-0001 and threads P123-THR-0001, allocated by the
  # numbering allocator in the transaction that creates the record.
  - id: correspondence.Correspondence
    record_type: correspondence.Correspondence
    scope: "project:*"
    template: "{project}-{type}-{seq:4}"
    type_code: COR
    gap_free: true
  - id: correspondence.CorrespondenceThread
    record_type: correspondence.CorrespondenceThread
    scope: "project:*"
    template: "{project}-{type}-{seq:4}"
    type_code: THR
    gap_free: true
