# Numbering patterns (brief 8). Read by tl_core.numbering.config; see its docstring for the fields.
# `gap_free: true` (the default) allocates a number only inside the transaction that creates the
# record it names. `reserved` lists inclusive sequence ranges the allocator skips.
patterns:
  - id: core.Record
    record_type: core.Record
    scope: "project:*"
    template: "{project}-{type}-{seq:4}"
    type_code: REC
    gap_free: true
  # Transmittals (brief 9 M1) are numbered by the allocator: P123-TRN-0001. A document number is typed in
  # (it comes from the drawing or the client) and checked by the registry pattern instead.
  - id: documents.Transmittal
    record_type: documents.Transmittal
    scope: "project:*"
    template: "{project}-{type}-{seq:4}"
    type_code: TRN
    gap_free: true
  # Receipts (brief 9 M4) are numbered by the allocator: P123-RCPT-0001. A stock lot's key is built from it
  # (P123-RCPT-0001@1) and needs no pattern of its own.
  - id: materials.Receipt
    record_type: materials.Receipt
    scope: "project:*"
    template: "{project}-{type}-{seq:4}"
    type_code: RCPT
    gap_free: true
  # Correspondence (brief 9 M10): items P123-COR-0001 and threads P123-THR-0001, allocated by the
  # numbering allocator in the transaction that creates the record.
  - id: correspondence.Correspondence
    record_type: correspondence.Correspondence
    scope: "project:*"
    template: "{project}-{type}-{seq:4}"
    type_code: COR
    gap_free: true
  - id: correspondence.CorrespondenceThread
    record_type: correspondence.CorrespondenceThread
    scope: "project:*"
    template: "{project}-{type}-{seq:4}"
    type_code: THR
    gap_free: true
  # Technical and Commercial items (brief 9 M10): the `kind` field is the number code of the subtype
  # (RFI, TQ, DEV; EW, CN, SI, QT, CL, DC, PA, BC), so each kind counts on its own: P123-RFI-0001,
  # P123-EW-0001. The domain file names the code of each subtype (`number_code`).
  - id: correspondence.TechnicalItem
    record_type: correspondence.TechnicalItem
    scope: "project:*"
    template: "{project}-{kind}-{seq:4}"
    type_code: TEC
    gap_free: true
  - id: correspondence.CommercialItem
    record_type: correspondence.CommercialItem
    scope: "project:*"
    template: "{project}-{kind}-{seq:4}"
    type_code: COM
    gap_free: true
  # Construction work packages (brief 9 M3): the discipline code is a segment of the number, so each discipline
  # counts on its own: P123-CWP-PIP-0001, P123-CWP-CIV-0001.
  - id: awp.CWP
    record_type: awp.CWP
    scope: "project:*"
    template: "{project}-{type}-{discipline}-{seq:4}"
    type_code: CWP
    gap_free: true
  # Interim work packages (brief 9 M3): counted per discipline, gap-free: P123-IWP-PIP-0001, P123-IWP-CIV-0001.
  - id: awp.IWP
    record_type: awp.IWP
    scope: "project:*"
    template: "{project}-{type}-{discipline}-{seq:4}"
    type_code: IWP
    gap_free: true
  # Scope items: one count per project, gaps allowed: P123-SCI-000001.
  - id: awp.ScopeItem
    record_type: awp.ScopeItem
    scope: "project:*"
    template: "{project}-{type}-{seq:6}"
    type_code: SCI
    gap_free: false
  # Constraints: P123-CON-0001, gap-free.
  - id: core.Constraint
    record_type: core.Constraint
    scope: "project:*"
    template: "{project}-{type}-{seq:4}"
    type_code: CON
    gap_free: true
  # Requisitions (brief 9 M9): one gap-free counter per kind, P123-REQ-LAB-0001 and so on; the work order has its own.
  - id: requisitions.LaborRequisition
    record_type: requisitions.LaborRequisition
    scope: "project:*"
    template: "{project}-REQ-LAB-{seq:4}"
    type_code: REQLAB
    gap_free: true
  - id: requisitions.MaterialRequisition
    record_type: requisitions.MaterialRequisition
    scope: "project:*"
    template: "{project}-REQ-MAT-{seq:4}"
    type_code: REQMAT
    gap_free: true
  - id: requisitions.GeneralRequisition
    record_type: requisitions.GeneralRequisition
    scope: "project:*"
    template: "{project}-REQ-GEN-{seq:4}"
    type_code: REQGEN
    gap_free: true
  - id: requisitions.ScaffoldRequest
    record_type: requisitions.ScaffoldRequest
    scope: "project:*"
    template: "{project}-REQ-SCF-{seq:4}"
    type_code: REQSCF
    gap_free: true
  - id: requisitions.WorkOrder
    record_type: requisitions.WorkOrder
    scope: "project:*"
    template: "{project}-WO-{seq:4}"
    type_code: WO
    gap_free: true
