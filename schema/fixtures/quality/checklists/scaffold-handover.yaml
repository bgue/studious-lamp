  - {id: "q3", text: "Platforms are fully boarded with toe boards", kind: "yes_no_na", required: true, unit: null, min: null, max: null, choices: null, fails_when: "no"}
  - {id: "q4", text: "Guardrails are in place at every open edge", kind: "yes_no_na", required: true, unit: null, min: null, max: null, choices: null, fails_when: "no"}
  - {id: "q5", text: "Access ladder is secured and extends above the platform", kind: "yes_no_na", required: false, unit: null, min: null, max: null, choices: null, fails_when: null}
