# Sample public intake template (P2-FORMS S2, ADR-0032 decision 2): intake is public, so the fields are text, choice
# and number only, at most 8, no visible_when, and a number carries min and max. `purpose` and `accepts_as` name what
# an accepted item becomes. The claim_* ids hold what the sender says about themselves; they are never verified.
title: "Scaffold request"
format_version: 2
bound_record_type: null
answer_class: "internal"
intake: "public"
purpose: "request"
accepts_as: ["SubmitForm"]
fields:
  - id: "claim_name"
    text: "Your name"
    kind: "text"
    required: true
    unit: null
    min: null
    max: null
    choices: null
    fails_when: null
    section: null
    help: null
    visible_when: null
  - id: "claim_company"
    text: "Your company"
    kind: "text"
    required: true
    unit: null
    min: null
    max: null
    choices: null
    fails_when: null
    section: null
    help: null
    visible_when: null
  - id: "location"
    text: "Where is the scaffold needed?"
    kind: "text"
    required: true
    unit: null
    min: null
    max: null
    choices: null
    fails_when: null
    section: null
    help: null
    visible_when: null
  - id: "scaffold_type"
    text: "Type of scaffold"
    kind: "choice"
    required: true
    unit: null
    min: null
    max: null
    choices: ["Access", "Birdcage", "Mobile tower", "Other"]
    fails_when: null
    section: null
    help: null
    visible_when: null
  - id: "height_m"
    text: "Height needed"
    kind: "number"
    required: true
    unit: "m"
    min: 1
    max: 60
    choices: null
    fails_when: null
    section: null
    help: null
    visible_when: null
  - id: "needed_by"
    text: "What is it for, and when?"
    kind: "text"
    required: false
    unit: null
    min: null
    max: null
    choices: null
    fails_when: null
    section: null
    help: null
    visible_when: null
