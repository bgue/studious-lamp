# File slots of a Commercial item (early warning, change notice, claim ...) (brief 9 M10, 20.1): the four slots of a correspondence item.
# `rendition` and `message` are written by the module only (the state guard refuses a person's upload).
id: https://example.org/throughline/fixtures/files/correspondence-commercial-item
name: tl_fixture_correspondence_commercial_item_files
prefixes:
  linkml: https://w3id.org/linkml/
  throughline: https://example.org/throughline/
default_prefix: throughline
imports:
  - linkml:types
default_range: string
annotations:
  tl:module: correspondence

classes:
  CommercialItem:
    annotations:
      tl:file_slots:
        - name: original
          label: Original letter or message
          cardinality: many
          max_size: 104857600
          retention_class: project
        - name: attachment
          label: Attachment
          cardinality: many
          max_size: 524288000
          retention_class: project
        - name: rendition
          label: Issued PDF
          cardinality: many
          accepted_types:
            - application/pdf
          max_size: 52428800
          retention_class: project
        - name: message
          label: Ingested email (raw)
          cardinality: many
          accepted_types:
            - message/rfc822
          max_size: 26214400
          retention_class: project
