# Workflow of an inspection checklist (brief 9 M5): Draft, Published by a controller, Retired. A draft or a
# published checklist can be retired. Retired is the only final state; any move out of it is not a move. Every move
# is a command of the quality module (by_module), so the file states the moves and names no role: who may do what
# is the access word of each command (ADR-0013).
id: quality.checklist
version: 1
record_type: quality.Checklist
scope: company
initial_state: Draft
states:
  - name: Draft
  - name: Published
  - name: Retired
transitions:
  - name: publish
    label: Publish the checklist
    from: [Draft]
    to: Published
  - name: retire
    label: Retire the checklist
    from: [Published, Draft]
    to: Retired
