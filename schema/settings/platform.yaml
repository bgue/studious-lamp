# Platform setting definitions (brief 30.1, 30.5; P0-I8 decision D2).
# Validated against the LinkML class `SettingDefinition` in schema/core/settings.yaml and loaded by
# `tl_core.settings.definitions`. A key is listed here only when the platform has behaviour behind it.
# Keys of modules that do not exist yet are added with their module.
settings:
  - key: feed.reactions.enabled
    type: bool
    default: true
    description: Whether people can react to posts in the activity feed.
    docs: >-
      When off, a reaction is refused with "reactions are switched off". Reactions already recorded stay in the
      ledger and in the feed.
    scopes: [platform, company, project]
    lockable: true
    since: "0.1.0"

  - key: feed.signal_tags
    type: list
    default: [safety, hold, decision, urgent, fyi]
    description: Hash-tags that mark a post as a signal and raise its importance.
    docs: >-
      Lower-case words without the leading hash. A post that uses one of them is shown with high importance.
      The change applies to posts written after it; posts already written keep the tags they were parsed with.
    scopes: [platform, company, project]
    lockable: true
    validation:
      pattern: "^[a-z][a-z0-9_-]{0,31}$"
    since: "0.1.0"

  - key: webhooks.retry.max_hours
    type: decimal
    default: 24
    description: How many hours a webhook delivery is retried before it goes to the dead-letter queue.
    docs: >-
      The deadline is counted from when the delivery was queued. Raising it keeps receivers that are down for a
      long time catching up; lowering it moves failing deliveries to the dead-letter queue sooner.
    scopes: [platform, company]
    lockable: true
    validation:
      minimum: 0.1
      maximum: 720
    risk: advanced
    since: "0.1.0"

  - key: webhooks.egress.allowlist
    type: list
    default: []
    description: Hosts, host:port pairs, IP addresses and CIDR ranges that webhooks may reach even when they are private or plain http.
    docs: >-
      By default a webhook may only reach public addresses over https. Every entry here lifts that guard for one
      destination, so widening the list lets the platform call into your own network. Dangerous to widen.
      An entry is a host name, host:port, an IP address or a CIDR range of at least /8 (IPv4) or /16 (IPv6).
      Link-local and cloud-metadata addresses (169.254.0.0/16, fe80::/10, 100.100.100.200) and the names of
      metadata services are never allowed, and the delivery engine refuses them even for an allowed host.
    scopes: [platform, company]
    lockable: true
    validation:
      pattern: "^[A-Za-z0-9._:\\[\\]/-]{1,255}$"
    risk: dangerous
    since: "0.1.0"

  - key: lake.sync.interval
    type: duration
    default: 5m
    description: How often `tl lake sync --watch` copies new ledger events into the lake.
    docs: >-
      Read again before every wait, so a change applies to a running watcher without a restart. Between 10 seconds
      and 1 day.
    scopes: [platform, company]
    validation:
      minimum: 10
      maximum: 86400
    since: "0.1.0"

  - key: ai.agents.default_mode
    type: enum
    default: propose
    description: What an AI agent's record-changing tools do.
    docs: >-
      Only `propose` exists: a tool call records a proposal and a person accepts it. Direct writes are not available
      until the permission model is decided (a human gate). Typically company-locked.
    scopes: [platform, company, project]
    lockable: true
    validation:
      choices: [propose]
    risk: advanced
    since: "0.1.0"

  - key: ai.agents.daily_proposals
    type: int
    default: 500
    description: How many proposals one AI agent may create per UTC day.
    docs: >-
      Accepted, rejected and failed proposals count too. 0 stops every agent from proposing. The environment
      variable TL_AGENT_DAILY_PROPOSALS, when set, overrides this value for the process.
    scopes: [platform, company]
    validation:
      minimum: 0
      maximum: 100000
    risk: advanced
    since: "0.1.0"

  - key: project.mode
    type: enum
    default: live
    description: What kind of project this is.
    docs: >-
      `live` is a real project. `sandbox` and `simulated` hold practice and generated data, and `mirror` follows a
      project kept in another suite. Phase 0 stores and shows the mode; it changes no behaviour yet.
    scopes: [platform, project]
    lockable: true
    validation:
      choices: [live, sandbox, simulated, mirror]
    risk: advanced
    since: "0.1.0"

  - key: ui.tui.keymap
    type: enum
    default: default
    description: The key bindings of the terminal UI.
    docs: A personal preference. Phase 0 stores and shows it; `vim` bindings arrive with the key map work.
    scopes: [platform, user]
    validation:
      choices: [default, vim]
    since: "0.1.0"

  - key: ui.tui.graphics
    type: enum
    default: auto
    description: How the terminal UI draws images and charts.
    docs: A personal preference. `auto` picks the best protocol the terminal reports.
    scopes: [platform, user]
    validation:
      choices: [auto, kitty, iterm2, sixel, "off"]
    since: "0.1.0"

  # P1-I7 WS-B: record threads with dispatch (brief 21.5; ADR-0018).
  - key: threads.enabled
    type: bool
    default: false
    description: Whether record threads are switched on.
    docs: >-
      A thread needs this switch and a record type listed in `threads.enabled_types`. Messages already
      posted stay in the ledger; while threads are off nobody sees them and nobody can post, and they are shown
      again when threads are switched on.
    scopes: [platform, company, project]
    lockable: true
    since: "0.1.0"

  - key: threads.enabled_types
    type: list
    default: []
    description: The record types that have a thread, for example `core.Record` or `documents.Revision`.
    docs: >-
      Empty means no record type has a thread, even when `threads.enabled` is on. A type is listed by its full
      name, as it appears in the record's type.
    scopes: [platform, company, project]
    lockable: true
    validation:
      pattern: "^[A-Za-z][A-Za-z0-9_.-]{0,127}$"
    since: "0.1.0"

  - key: threads.dispatch.enabled
    type: bool
    default: true
    description: Whether a slash command in a thread can dispatch work.
    docs: >-
      When off, a thread still takes messages, but previews and dispatches are refused. Dispatch runs existing
      commands with the caller's own access, never more.
    scopes: [platform, company, project]
    lockable: true
    since: "0.1.0"

  - key: threads.dispatch.roles
    type: list
    default: []
    description: The roles that may dispatch from a thread. Empty means any signed-in person.
    docs: >-
      A person needs one of these roles to confirm a dispatch, and each command the dispatch runs still needs
      its own access. Names are the account roles (`admin`, `document_controller`, `user`).
    scopes: [platform, company, project]
    lockable: true
    validation:
      choices: [admin, document_controller, user]
    since: "0.1.0"

  - key: threads.agents.can_dispatch
    type: enum
    default: propose
    description: What an AI agent may do with a dispatch from a thread.
    docs: >-
      `propose` lets an agent record a proposal that a person previews and accepts. `none` refuses the tool.
      An agent never dispatches directly.
    scopes: [platform, company, project]
    lockable: true
    validation:
      choices: [propose, none]
    risk: advanced
    since: "0.1.0"

  - key: threads.reminders.max_pending
    type: int
    default: 20
    description: How many reminders one thread, and one person, may have waiting at a time.
    docs: >-
      A `/remind` is refused while this many reminders set from the same thread, or by the same person, are
      still waiting to fall due. There is no scheduler for the `thread.reminder` job in the server: run
      `tl thread reminders` (or the P1-I7 job runner) so that due reminders are posted.
    scopes: [platform, company, project]
    lockable: true
    validation:
      minimum: 1
      maximum: 1000
    since: "0.1.0"

  # P1-I7 WS-A: the integration layer (FANOUT D11, ADR-0017)
  - key: integration.kill_switch
    type: bool
    default: false
    description: Stops every inbound endpoint, rule, action executor and enricher.
    docs: >-
      When on, inbound endpoints answer the same 404 as an unknown path, the rules worker and the enrichment
      dispatcher pass over the events they read and record them as killed (they are not replayed when the switch
      goes off), and action jobs fail with `killed` and are not retried. Records, people and webhooks are not
      affected. Read before every batch and every delivery, so a running worker obeys a change at once.
    scopes: [platform, company]
    lockable: true
    risk: advanced
    since: "0.1.0"

  # P2-W0 W0-B1: shared Phase 2 keys (brief 30.5; specs/wave0.md section 2). Defaults the brief does
  # not give are proposed and marked so; the approver is the orchestrator under P2-Q10.
  - key: awp.iwp.ready_lead_weeks
    type: int
    default: 4
    description: How many weeks before its planned start an installation work package should be ready.
    docs: >-
      The COAA lead time. It drives the need-by date of a constraint raised for an IWP (planned start minus
      this many weeks). Changing it applies to constraints raised afterwards; need-by dates already set stay.
    scopes: [platform, company, project]
    lockable: true
    validation:
      minimum: 0
      maximum: 52
    since: "0.1.0"

  - key: awp.backlog.target_weeks
    type: int
    default: 4
    description: The target backlog of ready installation work packages per foreman, in weeks of work.
    docs: >-
      Used by the backlog view to show whether a foreman has enough ready work ahead. It is a target, not a
      limit: nothing is refused when a foreman is above or below it.
    scopes: [platform, company, project]
    lockable: true
    validation:
      minimum: 0
      maximum: 52
    since: "0.1.0"

  - key: awp.iwp.size_hours
    type: list
    default: [60, 850]
    description: The warning bounds for the estimated hours of one installation work package, [low, high].
    docs: >-
      Two numbers, the low then the high bound (the COAA example range). An IWP outside the range is flagged,
      never refused. Keep the low bound below the high one.
    scopes: [platform, company, project]
    lockable: true
    since: "0.1.0"

  - key: awp.release.signoff_roles
    type: list
    default: [superuser]
    description: The module roles that may sign off the release of an installation work package.
    docs: >-
      Names are the module roles of the role table. Default proposed: superuser of the awp module. Releasing
      needs distinct signers; the release command checks the signer holds one of these roles in the project.
    scopes: [platform, company, project]
    lockable: true
    validation:
      choices: [user, superuser]
    risk: advanced
    since: "0.1.0"

  - key: awp.release.allow_unknown_checks
    type: bool
    default: false
    description: Whether an installation work package may be released while a readiness check answers unknown.
    docs: >-
      Off: release is refused when any readiness check could not answer. On: an unknown check no longer blocks
      release (blocked and pending checks still do). Turn it on only to work around a broken check.
    scopes: [platform, company, project]
    lockable: true
    risk: advanced
    since: "0.1.0"

  - key: awp.rules_of_credit.set
    type: string
    default: ""
    description: The edition of the rules of credit in force. Empty means the company standard.
    docs: >-
      Names a rules-of-credit edition loaded as a company registry record. Empty uses the company standard
      edition. Earned progress already recorded keeps the edition it was computed with.
    scopes: [platform, company, project]
    lockable: true
    validation:
      pattern: "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$|^$"
    since: "0.1.0"

  - key: awp.constraint.aging_days
    type: int
    default: 14
    description: How many days an open constraint may stand before it is shown as aging. Proposed default.
    docs: >-
      Counted from when the constraint was raised. Aging constraints are listed first on the constraint
      screen and in the readiness summary. Nothing is closed or escalated automatically.
    scopes: [platform, company, project]
    lockable: true
    validation:
      minimum: 1
      maximum: 365
    since: "0.1.0"

  - key: awp.constraint.auto_raise
    type: bool
    default: true
    description: Whether a blocked readiness check raises a constraint on its own. Proposed default.
    docs: >-
      On: the readiness job raises a constraint for a blocked check that names records to resolve, owned by a
      default owner and needed by the IWP's planned start minus the lead time. Off: constraints are raised by
      people only.
    scopes: [platform, company, project]
    lockable: true
    since: "0.1.0"

  - key: awp.constraint.default_owners
    type: list
    default: []
    description: The accounts that own a constraint raised automatically, as user:<name> actor strings.
    docs: >-
      Empty means an automatically raised constraint has no owner until someone takes it. Proposed default.
    scopes: [platform, company, project]
    lockable: true
    validation:
      pattern: "^user:[A-Za-z0-9._-]{1,64}$"
    since: "0.1.0"

  - key: materials.receipt.mtr_required_categories
    type: list
    default: []
    description: The item categories whose receipts must carry a material test report before they are accepted.
    docs: >-
      A project lists ItemCategory codes. For an item in a listed category the receipt's `mtr` slot must hold
      an available file or acceptance is refused. Empty means no category requires one. Proposed default.
    scopes: [platform, company, project]
    lockable: true
    validation:
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    since: "0.1.0"

  - key: scaffold.inspection.interval_days
    type: int
    default: 7
    description: How many days may pass between inspections of an erected scaffold. Proposed default.
    docs: >-
      The scaffold inspections-due job raises an inspection for each erected scaffold whose last inspection
      is older than this many days. Seven days is the usual rule for scaffold in use.
    scopes: [platform, company, project]
    lockable: true
    validation:
      minimum: 1
      maximum: 90
    since: "0.1.0"
