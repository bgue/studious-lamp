id: https://example.org/throughline/modules/quality/events
name: tl_mod_quality_events
title: Quality module events
description: >-
  The ledger events of the quality module (brief 18.3), in the same form as `schema/core/events.yaml`. A punch item
  is created by `Record.Created` followed in the same append by `PunchItem.Raised`. Every event carries
  `feed_policy: none`: a punch item makes no feed card. Each payload names the stream's `record_id`. `at` of
  `Cleared` and `Verified` is the world date of the fact (ADR-0026); `due_on` is a plan, not valid time.
prefixes:
  linkml: https://w3id.org/linkml/
  throughline: https://example.org/throughline/
default_prefix: throughline
imports:
  - linkml:types
  - ../../core/annotations
  - ../../core/record
  - ../../core/events
  - punch_item
  - checklist
  - inspection
default_range: string
annotations:
  tl:module: quality

classes:
  PunchItemRaisedPayload:
    is_a: EventPayload
    description: >-
      A punch item was raised. Stream type `quality.PunchItem`.
    annotations:
      tl:event_type: PunchItem.Raised
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The punch item."
        required: true
      area:
        description: "Area, or null."
      system:
        description: "System, or null."
      due_on:
        description: "YYYY-MM-DD, or null."
      category:
        range: PunchCategory
        description: "A, B or C."
        required: true
      assignee:
        description: "Assignee, or null."
      raised_by:
        description: "Actor text of who raised it."
        required: true
      source_id:
        description: "The record it was raised from, or null."
      at:
        range: datetime
        description: "When it happened in the field; absent means the recorded time (D19)."
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: a punch item makes no feed card."
        required: true
    examples:
      - value: "{\"area\": \"A1\", \"assignee\": \"user:rob\", \"category\": \"B\", \"due_on\": \"2026-12-01\", \"feed_policy\": \"none\", \"raised_by\": \"user:uma\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\", \"source_id\": null, \"system\": \"47-01\"}"
  PunchItemEditedPayload:
    is_a: EventPayload
    description: >-
      A punch item was edited; only the fields that changed are present. Stream type `quality.PunchItem`.
    annotations:
      tl:event_type: PunchItem.Edited
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The punch item."
        required: true
      changes:
        description: "Object of field -> [old, new]."
        range: Any
        required: true
        annotations:
          tl:json: true
      at:
        range: datetime
        description: "When it happened in the field; absent means the recorded time (D19)."
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: a punch item makes no feed card."
        required: true
    examples:
      - value: "{\"changes\": {\"area\": [\"A1\", \"A2\"]}, \"feed_policy\": \"none\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\"}"
  PunchItemClearedPayload:
    is_a: EventPayload
    description: >-
      A punch item was cleared by its assignee. Stream type `quality.PunchItem`.
    annotations:
      tl:event_type: PunchItem.Cleared
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The punch item."
        required: true
      by:
        description: "Actor text of who cleared it."
        required: true
      note:
        description: "What was done."
        required: true
      at:
        range: datetime
        description: "When it was cleared."
        required: true
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: a punch item makes no feed card."
        required: true
    examples:
      - value: "{\"at\": \"2026-12-02T09:30:00Z\", \"by\": \"user:rob\", \"feed_policy\": \"none\", \"note\": \"Guard fitted\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\"}"
  PunchItemVerifiedPayload:
    is_a: EventPayload
    description: >-
      A cleared punch item was verified by a controller. Stream type `quality.PunchItem`.
    annotations:
      tl:event_type: PunchItem.Verified
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The punch item."
        required: true
      by:
        description: "Actor text of who verified it."
        required: true
      at:
        range: datetime
        description: "When it was verified."
        required: true
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: a punch item makes no feed card."
        required: true
    examples:
      - value: "{\"at\": \"2026-12-03T14:00:00Z\", \"by\": \"user:sue\", \"feed_policy\": \"none\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\"}"
  PunchItemReopenedPayload:
    is_a: EventPayload
    description: >-
      A cleared or verified punch item was reopened by a controller. Stream type `quality.PunchItem`.
    annotations:
      tl:event_type: PunchItem.Reopened
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The punch item."
        required: true
      by:
        description: "Actor text of who reopened it."
        required: true
      reason:
        description: "Why it was reopened."
        required: true
      at:
        range: datetime
        description: "When it happened in the field; absent means the recorded time (D19)."
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: a punch item makes no feed card."
        required: true
    examples:
      - value: "{\"by\": \"user:sue\", \"feed_policy\": \"none\", \"reason\": \"Guard loose\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\"}"
  PunchItemVoidedPayload:
    is_a: EventPayload
    description: >-
      An open or cleared punch item was voided by a controller. Stream type `quality.PunchItem`.
    annotations:
      tl:event_type: PunchItem.Voided
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The punch item."
        required: true
      by:
        description: "Actor text of who voided it."
        required: true
      reason:
        description: "Why it was voided."
        required: true
      at:
        range: datetime
        description: "When it happened in the field; absent means the recorded time (D19)."
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: a punch item makes no feed card."
        required: true
    examples:
      - value: "{\"by\": \"user:sue\", \"feed_policy\": \"none\", \"reason\": \"Raised twice\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\"}"
  ChecklistCreatedPayload:
    is_a: EventPayload
    description: >-
      A checklist was created. Stream type `quality.Checklist`.
    annotations:
      tl:event_type: Checklist.Created
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The record."
        required: true
      discipline:
        description: "Discipline, or null."
      questions:
        description: "List of questions."
        range: Any
        annotations:
          tl:json: true
      question_count:
        description: "Number of questions."
        range: integer
      version:
        description: "Version number."
        range: integer
      supersedes_id:
        description: "The checklist it replaces, or null."
      at:
        range: datetime
        description: "When it happened in the field; absent means the recorded time (D19)."
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: no feed card."
        required: true
    examples:
      - value: "{\"discipline\": \"piping\", \"feed_policy\": \"none\", \"question_count\": 1, \"questions\": [{\"id\": \"q1\", \"text\": \"Gauge fitted?\", \"kind\": \"yesno\", \"required\": true}], \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\", \"supersedes_id\": null, \"version\": 1}"
  ChecklistEditedPayload:
    is_a: EventPayload
    description: >-
      A draft checklist was edited; only fields that changed are present. Stream type `quality.Checklist`.
    annotations:
      tl:event_type: Checklist.Edited
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The record."
        required: true
      changes:
        description: "Object of field -> [old, new]."
        range: Any
        annotations:
          tl:json: true
      at:
        range: datetime
        description: "When it happened in the field; absent means the recorded time (D19)."
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: no feed card."
        required: true
    examples:
      - value: "{\"changes\": {\"discipline\": [\"piping\", \"civil\"]}, \"feed_policy\": \"none\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\"}"
  ChecklistPublishedPayload:
    is_a: EventPayload
    description: >-
      A checklist was published. Stream type `quality.Checklist`.
    annotations:
      tl:event_type: Checklist.Published
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The record."
        required: true
      published_on:
        description: "YYYY-MM-DD."
      at:
        range: datetime
        description: "When it happened in the field; absent means the recorded time (D19)."
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: no feed card."
        required: true
    examples:
      - value: "{\"feed_policy\": \"none\", \"published_on\": \"2026-12-01\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\"}"
  ChecklistRetiredPayload:
    is_a: EventPayload
    description: >-
      A checklist was retired. Stream type `quality.Checklist`.
    annotations:
      tl:event_type: Checklist.Retired
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The record."
        required: true
      retired_on:
        description: "YYYY-MM-DD."
      at:
        range: datetime
        description: "When it happened in the field; absent means the recorded time (D19)."
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: no feed card."
        required: true
    examples:
      - value: "{\"feed_policy\": \"none\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\", \"retired_on\": \"2026-12-09\"}"
  InspectionPlannedPayload:
    is_a: EventPayload
    description: >-
      An inspection was planned. Stream type `quality.Inspection`.
    annotations:
      tl:event_type: Inspection.Planned
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The record."
        required: true
      subject_id:
        description: "The record inspected, or null."
      for_iwp_id:
        description: "The IWP it is for, or null."
      point:
        description: "hold, witness, review or surveillance."
        range: InspectionPoint
      area:
        description: "Area, or null."
      planned_on:
        description: "YYYY-MM-DD, or null."
      reinspection_of_id:
        description: "The inspection it repeats, or null."
      at:
        range: datetime
        description: "When it happened in the field; absent means the recorded time (D19)."
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: no feed card."
        required: true
    examples:
      - value: "{\"area\": \"A1\", \"feed_policy\": \"none\", \"for_iwp_id\": null, \"planned_on\": \"2026-12-05\", \"point\": \"hold\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\", \"reinspection_of_id\": null, \"subject_id\": null}"
  InspectionScheduledPayload:
    is_a: EventPayload
    description: >-
      An inspection was scheduled or rescheduled. Stream type `quality.Inspection`.
    annotations:
      tl:event_type: Inspection.Scheduled
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The record."
        required: true
      checklist_id:
        description: "The checklist."
      checklist_version:
        description: "Version of the checklist."
        range: integer
      scheduled_for:
        description: "YYYY-MM-DD."
      inspector:
        description: "Who inspects."
      at:
        range: datetime
        description: "When it happened in the field; absent means the recorded time (D19)."
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: no feed card."
        required: true
    examples:
      - value: "{\"checklist_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P3\", \"checklist_version\": 1, \"feed_policy\": \"none\", \"inspector\": \"user:ian\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\", \"scheduled_for\": \"2026-12-06\"}"
  InspectionResultRecordedPayload:
    is_a: EventPayload
    description: >-
      The result of an inspection was recorded. Stream type `quality.Inspection`.
    annotations:
      tl:event_type: Inspection.ResultRecorded
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The record."
        required: true
      answers:
        description: "List of answers."
        range: Any
        annotations:
          tl:json: true
      result:
        description: "accept, reject or conditional."
        range: InspectionOutcome
      done_at:
        description: "When it was done."
        range: datetime
        annotations:
          tl:valid_time: at
        required: true
      note:
        description: "Note, or null."
      punch_item_ids:
        description: "Ids of the punch items raised."
        range: Any
        annotations:
          tl:json: true
      feed_policy:
        equals_string: none
        description: "Always `none`: no feed card."
        required: true
    examples:
      - value: "{\"answers\": [{\"q\": \"q1\", \"value\": true, \"note\": null}], \"done_at\": \"2026-12-06T10:00:00Z\", \"feed_policy\": \"none\", \"note\": null, \"punch_item_ids\": [], \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\", \"result\": \"accept\"}"
  InspectionVerifiedPayload:
    is_a: EventPayload
    description: >-
      A recorded inspection was verified by a controller. Stream type `quality.Inspection`.
    annotations:
      tl:event_type: Inspection.Verified
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The record."
        required: true
      verified_on:
        description: "YYYY-MM-DD."
        range: date
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: no feed card."
        required: true
    examples:
      - value: "{\"feed_policy\": \"none\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\", \"verified_on\": \"2026-12-07\"}"
  InspectionCancelledPayload:
    is_a: EventPayload
    description: >-
      An inspection was cancelled. Stream type `quality.Inspection`.
    annotations:
      tl:event_type: Inspection.Cancelled
      tl:event_version: "1"
    attributes:
      record_id:
        description: "The record."
        required: true
      reason:
        description: "Why it was cancelled."
      at:
        range: datetime
        description: "When it happened in the field; absent means the recorded time (D19)."
        annotations:
          tl:valid_time: at
      feed_policy:
        equals_string: none
        description: "Always `none`: no feed card."
        required: true
    examples:
      - value: "{\"feed_policy\": \"none\", \"reason\": \"Work moved\", \"record_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P2\"}"
