id: https://example.org/throughline/modules/quality/inspection
name: tl_mod_quality_inspection
title: Inspections (brief 9, M5)
description: >-
  An inspection is one planned look at the work: a point (hold, witness, review or surveillance), an area, a
  checklist, an inspector and a result. Its life is the workflow `quality-inspection`. The title of the record is
  on the envelope. Dates are `YYYY-MM-DD`.
prefixes:
  linkml: https://w3id.org/linkml/
  throughline: https://example.org/throughline/
default_prefix: throughline
imports:
  - linkml:types
  - ../../core/annotations
  - ../../core/record
default_range: string
annotations:
  tl:module: quality

enums:
  InspectionPoint:
    description: The kind of inspection point.
    permissible_values:
      hold:
        description: Work stops until the inspection is accepted.
      witness:
        description: The inspector is invited; work may go on if they do not come.
      review:
        description: A review of records.
      surveillance:
        description: A spot check.
  InspectionOutcome:
    description: The result of an inspection, null until it is Done.
    permissible_values:
      accept:
        description: Accepted.
      reject:
        description: Rejected.
      conditional:
        description: Accepted with punch items.

classes:
  Inspection:
    title: Inspection
    description: >-
      One inspection. Record type `quality.Inspection`; its key is the number the allocator gives it
      (`P123-INS-0001`). Offline class `draft_only`: an inspection is planned offline; scheduling, recording and
      verifying are central. `answers` holds a JSON list of `{q, value, note}`, one per question answered. An
      inspection is hidden through its subject (`subject_id`).
    annotations:
      tl:current_state: true
      tl:record_types: "quality.Inspection"
      tl:offline: draft_only
      tl:table: cur_quality_inspection
      tl:ix_subject: "subject_id"
      tl:ix_for_iwp: "for_iwp_id"
      tl:ix_checklist: "checklist_id"
      tl:ix_area: "area"
      tl:ix_scheduled_for: "scheduled_for"
      tl:ix_reinspection_of: "reinspection_of_id"
    attributes:
      id:
        identifier: true
        range: Ulid
        required: true
        description: "Record id; equals the ledger stream id and the `cur_core_record` id."
      scope:
        range: ScopeId
        required: true
        description: "The project scope, `project:<id>`."
      subject_id:
        range: Ulid
        description: "The record inspected; null when none. The confidentiality subject."
      for_iwp_id:
        range: Ulid
        description: "The IWP the inspection is for; null when none."
      checklist_id:
        range: Ulid
        description: "The checklist used; null until scheduled."
      checklist_version:
        range: integer
        description: "Version of the checklist when it was scheduled; null until scheduled."
      point:
        range: InspectionPoint
        description: "hold, witness, review or surveillance."
      area:
        pattern: "^.{1,64}$"
        description: "Area of the plant or site, at most 64 characters; null when none."
      planned_on:
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        description: "Planned date, `YYYY-MM-DD`; null when none."
      scheduled_for:
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        description: "Date it is scheduled for, `YYYY-MM-DD`; null until scheduled."
      inspector:
        pattern: "^.{1,120}$"
        description: "Who inspects, an actor text or a name, at most 120 characters; null until scheduled."
      result:
        range: InspectionOutcome
        description: "accept, reject or conditional; null until Done."
      done_at:
        range: datetime
        description: "When the inspection was done; null until Done."
      answers:
        range: Any
        required: true
        ifabsent: string([])
        annotations:
          tl:json: true
        description: 'JSON list of answers `{q, value, note}`. Column `answers_json`.'
      note:
        pattern: "^[\\s\\S]{1,1000}$"
        description: "Inspector's note, at most 1000 characters; null when none."
      recorded_by:
        pattern: "^.{1,64}$"
        description: "Actor who recorded the result; null until Done."
      verified_by:
        pattern: "^.{1,64}$"
        description: "Actor who verified it; null until verified."
      verified_on:
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        description: "Date it was verified, `YYYY-MM-DD`; null until verified."
      reinspection_of_id:
        range: Ulid
        description: "The inspection this one repeats; null when none."
      cancel_reason:
        pattern: "^[\\s\\S]{1,300}$"
        description: "Why it was cancelled, at most 300 characters; null unless cancelled."
      punch_count:
        range: integer
        required: true
        minimum_value: 0
        ifabsent: int(0)
        description: "How many punch items the result raised; default 0."
      last_seq:
        range: integer
        required: true
        description: "Ledger `seq` of the last event applied to this row."
