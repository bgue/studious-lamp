id: https://example.org/throughline/modules/awp/path
name: tl_mod_awp_path
title: Path of construction (brief 9, M3)
description: >-
  The `PathOfConstruction` is the project's ordered list of construction work areas. There is one per project; every version of the list is kept in `PathStep`. Spec: docs/build-spec/specs/m3-wbs-cwp.md section 2.
prefixes:
  linkml: https://w3id.org/linkml/
  throughline: https://example.org/throughline/
default_prefix: throughline
imports:
  - linkml:types
  - ../../core/annotations
  - ../../core/record
default_range: string
annotations:
  tl:module: awp

classes:
  PathOfConstruction:
    title: Path of construction
    description: >-
      The ordered CWA list of a project. Record type `awp.PathOfConstruction`; its key is built by the module
      (`P123-POC`, one per project) and its title is `Path of construction`. `current_version` names the
      version `cur_awp_path_step` holds as current; older versions stay as rows.
    annotations:
      tl:current_state: true
      tl:record_types: "awp.PathOfConstruction"
      tl:offline: none
      tl:table: cur_awp_path
      tl:ix_scope: "scope"
    attributes:
      id:
        identifier: true
        range: Ulid
        required: true
        description: Record id; equals the ledger stream id and the `cur_core_record` id.
      scope:
        range: ScopeId
        required: true
        description: The project scope, `project:<id>`.
      current_version:
        range: integer
        required: true
        minimum_value: 1
        description: The latest version of the path, 1 when first defined.
      last_seq:
        range: integer
        required: true
        description: Ledger `seq` of the last event applied to this row.

  PathStep:
    description: >-
      One place of one version of the path. Not a record: every version is kept, so a reader can compare two
      versions. Written by the projectors of `PathOfConstruction.Defined` and `.Resequenced`.
    annotations:
      tl:current_state: true
      tl:table: cur_awp_path_step
      tl:ix_path_version: "path_id, version, position"
      tl:ix_cwa: "cwa_id"
    attributes:
      row_id:
        identifier: true
        required: true
        description: "`<path id>:<version>:<position>`."
      scope:
        range: ScopeId
        required: true
        description: The project scope, `project:<id>`.
      path_id:
        range: Ulid
        required: true
        description: The `awp.PathOfConstruction`.
      version:
        range: integer
        required: true
        minimum_value: 1
        description: The version of the path this step belongs to.
      position:
        range: integer
        required: true
        minimum_value: 1
        description: Place in the version, from 1.
      cwa_id:
        range: Ulid
        required: true
        description: The `awp.CWA` at this place.
      reason_code:
        description: "Code of the code list `PathReason` for the re-sequencing that made this version; null in version 1 or when none was given."
      actor:
        required: true
        description: The actor that made this version (`user:<id>`).
      recorded_at:
        required: true
        description: The time the version was recorded (UTC, ISO 8601).
      last_seq:
        range: integer
        required: true
        description: Ledger `seq` of the event that wrote the row.
