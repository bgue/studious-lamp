id: https://example.org/throughline/modules/awp/constraint
name: tl_mod_awp_constraint
title: Constraints on an IWP (brief 9, M3)
description: >-
  A `Constraint` is something that holds an IWP back until it is cleared. Numbered `{project}-CON-{seq:4}`, gap-free. Its life is the workflow `awp-constraint`.
prefixes:
  linkml: https://w3id.org/linkml/
  throughline: https://example.org/throughline/
default_prefix: throughline
imports:
  - linkml:types
  - ../../core/annotations
  - ../../core/record
default_range: string
annotations:
  tl:module: awp

classes:
  Constraint:
    title: Constraint
    description: >-
      One constraint on one IWP. Record type `awp.Constraint`; key `P123-CON-0001` (gap-free). `suppress_hash` is the sha256 hex of the
      check result that a person chose to suppress (R-P2-11).
    annotations:
      tl:current_state: true
      tl:record_types: "awp.Constraint"
      tl:offline: draft_only
      tl:table: cur_awp_constraint
      tl:ix_scope_iwp: "scope, iwp_id"
    attributes:
      id:
        identifier: true
        range: Ulid
        required: true
        description: Record id; equals the ledger stream id and the `cur_core_record` id.
      scope:
        range: ScopeId
        required: true
        description: The project scope, `project:<id>`.
      iwp_id:
        range: Ulid
        required: true
        description: The `awp.IWP` the constraint holds back.
      constraint_type:
        required: true
        description: Code of the code list `ConstraintType`.
      source:
        required: true
        pattern: "^(manual|check|rule|feed_hold|thread_hold)$"
        description: "How the constraint arose: manual, check, rule, feed_hold or thread_hold."
      owner:
        required: true
        pattern: "^user:.{1,59}$"
        description: "Who must clear it, an actor text `user:<name>`."
      need_by:
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        description: "Date it must be cleared by, `YYYY-MM-DD`."
      description:
        annotations:
          tl:column: description_text
        pattern: "^.{0,500}$"
        description: What holds the package back (at most 500 characters).
      check_name:
        pattern: "^.{0,64}$"
        description: The readiness check that raised it (at most 64 characters; only for source `check`).
      raised_at:
        description: "When it was raised, UTC timestamp text."
      cleared_at:
        description: "When it was cleared, UTC timestamp text; null while open."
      cleared_by:
        description: "Who cleared it, an actor text."
      clear_reason:
        pattern: "^.{0,300}$"
        description: Why it was cleared (at most 300 characters).
      suppress_hash:
        pattern: "^[0-9a-f]{64}$"
        description: "SHA-256 hex of the check result suppressed (R-P2-11)."
      last_seq:
        range: integer
        required: true
        description: Ledger `seq` of the last event applied to this row.
