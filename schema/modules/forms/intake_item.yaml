id: https://example.org/throughline/modules/forms/intake_item
name: tl_mod_forms_intake_item
title: Intake items (ADR-0032)
description: >-
  An intake item is one submission received through a code. It waits as `Pending` until a person accepts it (it
  becomes a command the template names) or rejects it. The received text is not here: it is in `IntakeBody`, and the
  item holds only its MAC and size. Its life is the workflow `forms.intake-item`. A purge is `purged_at`, not a move.
prefixes:
  linkml: https://w3id.org/linkml/
  throughline: https://example.org/throughline/
default_prefix: throughline
imports:
  - linkml:types
  - ../../core/annotations
  - ../../core/record
  - template
default_range: string
annotations:
  tl:module: forms

enums:
  IntakeRejectReason:
    description: Why an intake item was rejected.
    permissible_values:
      spam:
        description: Not a real submission.
      duplicate:
        description: Already received.
      not_ours:
        description: Not for this company or project.
      unclear:
        description: Cannot be acted on.

classes:
  IntakeItem:
    title: Intake item
    description: >-
      One received intake submission. Record type `forms.IntakeItem`. Offline class `none`. It takes no number. It
      holds no typed text: `body_mac` and `body_bytes` describe the body held in `IntakeBody`. `on_behalf_of_claim`
      is a JSON object `{name, company}` set by `IntakeItem.Accepted` only: what the sender said about themselves,
      never verified.
    annotations:
      tl:current_state: true
      tl:record_types: "forms.IntakeItem"
      tl:offline: none
      tl:table: cur_forms_intake_item
      tl:ix_code: "code_id"
      tl:ix_received: "received_at"
    attributes:
      id:
        identifier: true
        range: Ulid
        required: true
        description: "Record id; equals the ledger stream id and the `cur_core_record` id."
      scope:
        range: ScopeId
        required: true
        description: "The scope of the code it came through."
      code_id:
        range: Ulid
        description: "The intake code it came through."
      template_id:
        range: Ulid
        description: "The template record."
      template_version:
        range: integer
        minimum_value: 1
        description: "The template version the code pinned."
      template_hash:
        pattern: "^[0-9a-f]{64}$"
        description: "The content hash of that version, 64 lower case hex characters."
      body_mac:
        pattern: "^[0-9a-f]{64}$"
        description: "MAC of the received body, 64 lower case hex characters."
      body_bytes:
        range: integer
        minimum_value: 0
        description: "Size of the received body in bytes."
      received_at:
        range: datetime
        description: "When it was received (receipt time is the only time in v1)."
      accepted_as:
        pattern: "^.{1,64}$"
        description: "Name of the command it became, at most 64 characters; null unless accepted."
      accepted_by:
        pattern: "^.{1,64}$"
        description: "Actor who accepted it; null unless accepted."
      accepted_on:
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        description: "Date it was accepted, `YYYY-MM-DD`; null unless accepted."
      on_behalf_of_claim:
        range: Any
        annotations:
          tl:json: true
        description: 'JSON object `{name, company}` the sender claimed; set by `Accepted` only. Column `on_behalf_of_claim_json`.'
      rejected_reason:
        range: IntakeRejectReason
        description: "Why it was rejected; null unless rejected."
      rejected_by:
        pattern: "^.{1,64}$"
        description: "Actor who rejected it; null unless rejected."
      purged_at:
        range: datetime
        description: "When its body was purged; null until purged."
      last_seq:
        range: integer
        required: true
        description: "Ledger `seq` of the last event applied to this row."
