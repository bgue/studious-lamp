id: https://example.org/throughline/core/extension
name: tl_core_extension
title: Throughline extension record types (type registry v0)
description: >-
  Extension record types are added by companies, projects and partners as packages of files, without a platform
  release or a database schema change (brief 31). A package is a directory `<namespace>/<Name>/<version>/` that holds
  `type.yaml` (a LinkML class that is_a `ExtensionRecord`), optional `workflow.yaml`, `form.yaml` and `settings.yaml`,
  `examples/`, and `type.lock`. Throughline stores metadata only. Registering a package is a ledger event on the stream
  `type:<namespace>.<Name>@<version>` (stream type `core.TypeRegistration`, scope `company`): `TypeRegistration.Registered`
  when the package validates, `TypeRegistration.Quarantined` with a report when it does not, `TypeRegistration.Deprecated`
  when an owner retires a version. An instance of an active type is a generic record whose `record_type` is
  `<namespace>.<Name>`. An object-backed instance keeps its body in the object store and records only a pointer
  (`Record.BodyStored`, on the record's own stream). This file declares the base class, the four event payloads, and the
  three tables the registry reads: `cur_core_type_registration` and `cur_core_record_body` are projections, and
  `tl_body_quarantine` is operational state that no event produces (like the `wh_*` tables, it uses `tl:current_state`
  and `tl:table` only to get one DDL for both dialects).
prefixes:
  linkml: https://w3id.org/linkml/
  throughline: https://example.org/throughline/
default_prefix: throughline
imports:
  - linkml:types
  - annotations
  - record
  - events
default_range: string
annotations:
  tl:module: core

enums:
  TypeStatus:
    description: Where a registered extension type version is in its life.
    permissible_values:
      active:
        description: Validated and registered; new instances may be created.
      quarantined:
        description: Failed validation; it has a report and no instances can be created.
      deprecated:
        description: Retired by its owner; existing instances stay readable, no new ones.
  StorageMode:
    description: Where the body of an extension type instance lives (brief 31.2).
    permissible_values:
      managed:
        description: The body is in the ledger, as pset values.
      object-backed:
        description: The body is a content-addressed document in the object store; the ledger holds a pointer.
      directory-backed:
        description: Files in a watched directory. Refused in v0 (TypeIssue `unsupported`).

classes:
  ExtensionRecord:
    is_a: RecordEnvelope
    abstract: true
    description: >-
      Base class of every extension record type. A package's `type.yaml` declares a class that is_a
      `ExtensionRecord`; its own slots are the body of an instance. A slot annotated `tl:index: true` is an index field
      (brief 31.4): it is copied into the pset named for the type, so the query language filters on it. The class
      annotation `tl:storage_mode` (`managed` or `object-backed`) says where the body lives.

  TypeRegistrationRegisteredPayload:
    is_a: EventPayload
    description: >-
      A type package validated and was registered. The package files stay where they are; this event holds metadata
      only. `content_hash` is the sha256 of the canonical bytes of the package's `type.lock`.
    annotations:
      tl:event_type: TypeRegistration.Registered
      tl:event_version: "1"
    attributes:
      namespace:
        required: true
        description: "Namespace, dotted lower-case segments, for example `co.acme`."
      name:
        required: true
        description: "Type name, UpperCamelCase, for example `LiftPlan`."
      version:
        required: true
        description: "Semantic version `MAJOR.MINOR.PATCH`."
      type_ref:
        required: true
        description: "`<namespace>.<name>@<version>`."
      location_uri:
        required: true
        description: "Where the package files are, for example `file:///srv/types/co.acme/LiftPlan/1.0.0`."
      content_hash:
        required: true
        description: "sha256 over the canonical bytes of `type.lock`."
      owner:
        required: true
        description: "Actor that registered the package."
      status:
        range: TypeStatus
        required: true
        description: "`active` for this event."
      storage_mode:
        range: StorageMode
        required: true
        description: "`managed` or `object-backed` in v0."
      index_fields:
        multivalued: true
        description: "Slots annotated `tl:index`: the query contract."
      schema_hash:
        required: true
        description: "Hash of the compiled class: the schema a stored body validated against."
    examples:
      - value: "{\"content_hash\": \"4d1c0a0f9f43b3a0a0f3a6a6b9d3f0a5c8e5d9b2f1a7c3e6d4b8a2f9c1e7d0b3\", \"index_fields\": [\"crane\", \"lift_date\", \"risk_class\"], \"location_uri\": \"file:///srv/types/co.acme/LiftPlan/1.0.0\", \"name\": \"LiftPlan\", \"namespace\": \"co.acme\", \"owner\": \"user:alice\", \"schema_hash\": \"7a3b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b\", \"status\": \"active\", \"storage_mode\": \"object-backed\", \"type_ref\": \"co.acme.LiftPlan@1.0.0\", \"version\": \"1.0.0\"}"

  TypeRegistrationQuarantinedPayload:
    is_a: EventPayload
    description: >-
      A type package failed validation, or its files changed under a version that is already registered. The report
      lists every problem (`kind`, `path`, `detail`). A conflict never removes a registration that is already active.
    annotations:
      tl:event_type: TypeRegistration.Quarantined
      tl:event_version: "1"
    attributes:
      type_ref:
        required: true
        description: "`<namespace>.<name>@<version>`, or `invalid:<relative path>` when the path is not a package path."
      location_uri:
        required: true
        description: "Where the package files are."
      content_hash:
        required: true
        description: "sha256 over the canonical `type.lock` form of the files as found."
      report:
        range: Any
        required: true
        description: "List of `{kind, path, detail}`."
        annotations:
          tl:json: true
    examples:
      - value: "{\"content_hash\": \"4d1c0a0f9f43b3a0a0f3a6a6b9d3f0a5c8e5d9b2f1a7c3e6d4b8a2f9c1e7d0b3\", \"location_uri\": \"file:///srv/types/co.acme/LiftPlan/1.0.1\", \"report\": [{\"detail\": \"examples/bad.json: 'risk_class' is not one of ['low', 'medium', 'high']\", \"kind\": \"example\", \"path\": \"examples/bad.json\"}], \"type_ref\": \"co.acme.LiftPlan@1.0.1\"}"

  TypeRegistrationDeprecatedPayload:
    is_a: EventPayload
    description: >-
      The owner retired a version. Existing instances stay readable and editable; no new instance can be created.
    annotations:
      tl:event_type: TypeRegistration.Deprecated
      tl:event_version: "1"
    attributes:
      type_ref:
        required: true
        description: "The deprecated version."
      reason:
        required: true
        description: "Why."
    examples:
      - value: "{\"reason\": \"superseded by 2.0.0\", \"type_ref\": \"co.acme.LiftPlan@1.0.0\"}"

  RecordBodyStoredPayload:
    is_a: EventPayload
    description: >-
      The body of an object-backed record was stored as a content-addressed object. The body itself is never in the
      ledger. A new body is a new object (a new hash); the old one stays, and `previous_hash` chains the versions.
    annotations:
      tl:event_type: Record.BodyStored
      tl:event_version: "1"
    attributes:
      stream_id:
        range: Ulid
        required: true
        description: "The record (this stream)."
      pointer:
        range: Any
        required: true
        description: "`{uri, hash, size, schema_hash}`: object key, sha256 of the stored bytes, size, schema the body validated against."
        annotations:
          tl:json: true
      previous_hash:
        description: "Hash of the body this one replaces; null for the first body."
    examples:
      - value: "{\"pointer\": {\"hash\": \"9c1f0e3a5b7d2c4f6a8b0d1e3f5a7c9b2d4f6a8c0e1b3d5f7a9c2e4b6d8f0a1c\", \"schema_hash\": \"7a3b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b\", \"size\": 412, \"uri\": \"records/co.acme.LiftPlan/01J9Z6Q4W3X2Y1V0T9S8R7Q6P5/9c1f0e3a5b7d2c4f6a8b0d1e3f5a7c9b2d4f6a8c0e1b3d5f7a9c2e4b6d8f0a1c.json\"}, \"previous_hash\": null, \"stream_id\": \"01J9Z6Q4W3X2Y1V0T9S8R7Q6P5\"}"

  TypeRegistrationRow:
    description: >-
      One registered type version: the current state of the stream `type:<namespace>.<Name>@<version>`. `type_name`
      (`co.acme.LiftPlan`) is what a record's `type` holds. An `active` or `deprecated` row whose files later changed keeps
      its status and shows the changed hash in `conflict_hash`, with the conflict in `report_json`.
    annotations:
      tl:current_state: true
      tl:table: cur_core_type_registration
    attributes:
      type_ref:
        identifier: true
        required: true
      type_name:
        required: true
        description: "`<namespace>.<name>`."
        annotations:
          tl:indexed: true
      namespace:
        required: true
      name:
        required: true
      version:
        required: true
      pset:
        description: "Name of the pset that holds the index fields of instances."
      location_uri:
        required: true
      content_hash:
        required: true
      owner:
        description: "Actor that registered it; null for a quarantined row."
      status:
        range: TypeStatus
        required: true
        annotations:
          tl:indexed: true
      storage_mode:
        range: StorageMode
        description: "Null for a quarantined row."
      index_fields:
        range: Any
        description: "JSON list of index field names."
        annotations:
          tl:json: true
      schema_hash:
        description: "Null for a quarantined row."
      report:
        range: Any
        description: "JSON list of `{kind, path, detail}`: why it was quarantined, or the conflict that was refused."
        annotations:
          tl:json: true
      conflict_hash:
        description: "Content hash of changed files refused under this registered version."
      reason:
        description: "Deprecation reason."
      first_seq:
        range: integer
        required: true
        description: "`seq` of the first event of the stream."
      last_seq:
        range: integer
        required: true
        description: "`seq` of the last event of the stream."
      version_n:
        range: integer
        required: true
        description: "Stream version after the last event applied."
      updated_at:
        range: datetime
        required: true

  RecordBody:
    description: >-
      The pointer to the current body of an object-backed record: one row per record, from `Record.BodyStored`.
    annotations:
      tl:current_state: true
      tl:table: cur_core_record_body
    attributes:
      record_id:
        identifier: true
        required: true
        range: Ulid
      scope:
        range: ScopeId
        required: true
      type_name:
        required: true
        annotations:
          tl:indexed: true
      uri:
        required: true
        description: "Object key `records/<type>/<id>/<sha256>.json`."
      hash:
        required: true
        description: "sha256 of the stored bytes."
      body_size:
        range: integer
        required: true
        description: "Size of the stored bytes."
      schema_hash:
        required: true
      body_versions:
        range: integer
        required: true
        description: "How many bodies the record has had."
      last_seq:
        range: integer
        required: true
      updated_at:
        range: datetime
        required: true

  BodyQuarantine:
    description: >-
      Operational state, not a projection: a record whose stored body failed verification on read (brief 31.4). Reads of
      the record's body are refused until the body is stored again or `tl types quarantine recheck` verifies it. A
      rebuild of projections never clears it.
    annotations:
      tl:current_state: true
      tl:table: tl_body_quarantine
    attributes:
      record_id:
        identifier: true
        required: true
        range: Ulid
      scope:
        range: ScopeId
        required: true
      type_name:
        required: true
      uri:
        required: true
      expected_hash:
        required: true
        description: "The hash the ledger recorded for the body."
      actual_hash:
        description: "Hash of the bytes found; null when the object is missing."
      reason:
        required: true
      detected_at:
        range: datetime
        required: true
        description: "When the mismatch was found."
