id: https://example.org/throughline/core/record
name: tl_core_record
title: Throughline core record envelope
description: >-
  The minimal common record envelope (brief 6.2) for Phase 0 and the generic `core.Record` type.
  Fields not needed before Increment 3 (discipline, area, wbs_ref, links, attachments and so on) are added
  by later schema tickets.
prefixes:
  linkml: https://w3id.org/linkml/
  throughline: https://example.org/throughline/
default_prefix: throughline
imports:
  - linkml:types
  - annotations
default_range: string
annotations:
  tl:module: core

types:
  Ulid:
    typeof: string
    description: A ULID string (26 characters, Crockford base32).
    pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
  ScopeId:
    typeof: string
    description: Either `company` or `project:<id>`.
    pattern: "^(company|project:[A-Za-z0-9_.-]+)$"

enums:
  ConformanceStatus:
    description: Result of evaluating a record against its effective schema (brief 6.3).
    permissible_values:
      ok:
      warning:
      nonconformant:
      waived:

classes:
  Any:
    class_uri: linkml:Any
    description: Any JSON value. Used with `tl:json` for slots stored as JSON columns.

  RecordEnvelope:
    abstract: true
    description: Fields every record type shares (brief 6.2). Mixed into each concrete record class.
    attributes:
      id:
        identifier: true
        range: Ulid
        required: true
        description: Immutable global identifier; equals the ledger `stream_id`.
      key:
        description: Human-readable number, unique within a scope. Null until numbering assigns one.
      type:
        required: true
        description: Fully qualified record type, for example `core.Record`.
      scope:
        range: ScopeId
        required: true
        description: "`company` or `project:<id>`."
      title:
        required: true
        description: Short human-readable title.
      description:
        description: Longer free-text description.
      status:
        description: Workflow state; null when the record type has no workflow.
      psets:
        range: Any
        required: true
        description: Property-set values keyed by pset name, stored as a JSON object.
        annotations:
          tl:json: true
      voided:
        range: boolean
        required: true
        ifabsent: "false"
        description: Set by `Record.Voided`. Voided rows are never deleted.
      version:
        range: integer
        required: true
        description: Ledger `stream_version` of the last event applied.
      last_seq:
        range: integer
        required: true
        description: Ledger `seq` of the last event applied.
      effective_schema_hash:
        description: Hash of the effective schema in force at the last write; null before Increment 2.
      conformance:
        range: ConformanceStatus
        required: true
        ifabsent: string(ok)
        description: Conformance of the current values to the effective schema.
      created_at:
        range: datetime
        required: true
        description: Timestamp of the creating event (system time).
      updated_at:
        range: datetime
        required: true
        description: Timestamp of the last applied event (system time).

  Record:
    is_a: RecordEnvelope
    description: The generic Phase 0 record type, `core.Record`.
    annotations:
      tl:current_state: true
    unique_keys:
      scope_key:
        description: A key is unique within its scope.
        unique_key_slots:
          - scope
          - key
