        range: integer
        required: true

  EnrichmentValue:
    description: >-
      A value an enricher proposed for one property of one record, with provenance (brief 18.9, 19.2). Accepting
      it writes only the enricher's own layer `enrich.<enricher>.<property>`; promoting it to an authoritative
      field is a person's own `SetPsetValues`. A `shadow` value is shown to admins and the evaluation report only.
    annotations:
      tl:current_state: true
      tl:table: cur_enrichment_value
      tl:ix_target: "target_id, property_path"
      tl:ix_queue: "acceptance_state, seq"
    attributes:
      value_id:
        identifier: true
        range: Ulid
        required: true
        description: Immutable id; equals the ledger `stream_id`.
      scope:
        range: ScopeId
        required: true
        annotations:
          tl:indexed: true
      target:
        range: Any
        required: true
        description: The `RecordRef` of the record, as JSON.
        annotations:
          tl:json: true
      target_id:
        required: true
      property_path:
        required: true
        description: "`enrich.<enricher>.<property>`."
      value:
        range: Any
        description: A scalar or a list of scalars, as JSON.
        annotations:
          tl:json: true
      enricher:
        required: true
      enricher_version:
        required: true
      confidence:
        range: float
        required: true
      inputs:
        range: Any
        required: true
        description: A JSON list of `EnrichmentInput`.
        annotations:
          tl:json: true
      model_ref:
      produced_at:
        required: true
      acceptance_state:
        range: AcceptanceState
        required: true
      decided_by:
      decided_at:
        range: datetime
      reason:
      seq:
        range: integer
        required: true
        description: "`seq` of `Enrichment.Proposed`."
      version:
        range: integer
        required: true
        description: Ledger stream version after the last event applied.
      last_seq:
        range: integer
        required: true
