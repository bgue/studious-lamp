id: https://example.org/throughline/core/annotations
name: tl_annotations
title: Throughline annotation namespace
description: >-
  Declares the `tl:` annotation tags that Throughline generators read. LinkML annotations are free-form,
  so this file is the single place that names them and says what each one means. It defines no classes.
  Generators ignore any tag not listed here. Add a tag by editing this file and the generator that reads it
  in the same change.

  Class-level tags
  - `tl:current_state` (boolean): generate a `cur_<module>_<class>` current-state table for this class (brief 5.4).
  - `tl:table` (string): override the generated table name (for example `cur_pset_values`).
  - `tl:history` (boolean): also generate a `hist_<module>_<class>` table (not used before Phase 3).
  - `tl:expects_link` (list of mappings): links a record of this class is expected to have (brief 7.1). Each entry has
    `relation` (forward relation code), optional `direction` (`out` | `in` | `either`, default `out`), optional
    `target_type`, optional `by_state` (the workflow state by which the link must exist), `label`, and optional
    `min_count` (default 1). Read at runtime by `tl_core.links.expected`; no generator reads it.
  - `tl:file_slots` (list of mappings): the file slots of a record type (brief 20.1). Each entry has `name`
    (lower_snake_case), optional `label`, `cardinality` (`one` | `many`, default `many`), `accepted_types`
    (list of media types, `image/*` style wildcards allowed; empty means any), `max_size` (bytes; none means no
    slot limit), `required_in_states` (list of workflow states by which the slot must hold an available file),
    `capture_hint` (`camera` | `scan` | `file`, default `file`), `metadata_pset`, `processing` (pipeline names),
    `retention_class` and `confidentiality`. Read at runtime by `tl_core.files.slots`; no generator reads it.
    Generic, unslotted attachments need no declaration.

  Pset class tags (written by the effective-schema compiler, brief 27.3; never authored in `schema/core`)
  - `tl:enforcement` (`advisory` | `required` | `locked`): company enforcement level of a pset or property (brief 6.3).
  - `tl:adoption` (`mandatory` | `default` | `optional`): whether projects get the pset.
  - `tl:custom_section` (boolean) and `tl:custom_max_properties` (integer as string): whether projects may add
    `x.` properties, and how many.
  - `tl:layer` (`standard` | `custom` | `project`): the pset layer the element belongs to.
  - `tl:applies_to` (JSON list of record types) and `tl:class_filter` (string): where a pset applies.
  - `tl:package` (`name@version`) and `tl:extension` (`name@version`): the package that defined the element and
    the project extension that changed it.
  - `tl:effective_schema_hash` and `tl:scope`: set on the effective schema itself.

  Schema-level tags
  - `tl:module` (string): the module segment of generated object names; `core` for everything under `schema/core`.

  Slot-level tags
  - `tl:json` (boolean): store the slot as a JSON column (TEXT on SQLite, JSONB on Postgres). The generated
    column name is the slot name with `_json` appended unless `tl:column` is set.
  - `tl:column` (string): override the generated column name.
  - `tl:indexed` (boolean): generate a plain index on this column.
  - `tl:materialize` (boolean): promote a company standard pset property to a typed column of the
    current-state table (brief 5.4). Written on pset properties; the column DDL is generated from the
    effective schema, not from `schema/core`.
  - `tl:value_list_policy` (`closed` | `extensible` | `project_defined`): how projects may change a value list.
  - `tl:required_in_states` (JSON list of states): states in which the property must have a value.
  - `tl:crosswalk` (string, on enum permissible values): the company code a project-added value maps to.
prefixes:
  linkml: https://w3id.org/linkml/
  throughline: https://example.org/throughline/
default_prefix: throughline
imports:
  - linkml:types
default_range: string
